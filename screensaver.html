  <body class="screensaver font-sans" data-controls="hidden" data-display="logo">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content" class="screensaver__frame" tabindex="-1">
      <section class="screensaver__stage" aria-label="ICAIF 2026 conference display">
        <img class="screensaver__poster" src="assets/screensaver/brand-waves-navy.webp" width="1254" height="1254" alt="" fetchpriority="high">
        <canvas class="screensaver__canvas" aria-hidden="true"></canvas>
        <div class="screensaver__identity">
          <img class="screensaver__mark" src="assets/screensaver/icaif-mark-white.svg" alt="ICAIF Milan: AI tree, city skyline and orbit" width="598" height="371">
          <div class="screensaver__wordmark">
            <h1 class="screensaver__title">ICAIF <span class="screensaver__year">’26</span></h1>
            <p class="screensaver__subject">Artificial Intelligence<br>in Finance</p>
          </div>
        </div>
        <section class="screensaver__programme" data-programme-panel aria-label="Room programme" hidden>
          <header class="screensaver__programme-header">
            <div>
              <h2 data-programme-room>Room programme</h2>
              <p data-programme-date></p>
            </div>
            <p class="screensaver__programme-brand">ICAIF <span>’26</span></p>
          </header>
          <ol class="screensaver__agenda" data-programme-list></ol>
          <p class="screensaver__programme-message" data-programme-message role="status"></p>
          <button class="btn" type="button" data-programme-retry hidden>Retry loading programme</button>
        </section>
      </section>

      <footer class="screensaver__sponsors" aria-label="Conference sponsors">
        <div class="screensaver__sponsor-grid">
          <section class="screensaver__tier screensaver__tier--platinum" aria-labelledby="display-platinum">
            <h2 id="display-platinum">Platinum sponsors</h2>
            <ul class="screensaver__logos">
              <li><img src="img/loghi/logo%20intesa/Marchio_IMI+INTESA_SANPAOLO_Materiali%20terzi.webp" alt="Intesa Sanpaolo IMI Corporate &amp; Investment Banking" width="576" height="181"></li>
              <li><img src="img/loghi/wellington/WMC_logo_blue.svg" alt="Wellington Management" width="10032" height="2037"></li>
              <li><img src="img/loghi/qrt-quantitative-research-technologies.svg" alt="QRT — Qube Research &amp; Technologies" width="295" height="337"></li>
              <li><img src="img/loghi/linqalpha/linqalpha-black.png" alt="LinqAlpha" width="2839" height="660"></li>
            </ul>
          </section>
          <section class="screensaver__tier screensaver__tier--gold" aria-labelledby="display-gold">
            <h2 id="display-gold">Gold sponsors</h2>
            <ul class="screensaver__logos">
              <li><img src="img/loghi/domyn/domyn-main-logo-primary-color.jpg" alt="Domyn" width="1745" height="422"></li>
              <li><img src="img/loghi/dxc/dxc-full-color.svg" alt="DXC Technology" width="860" height="240"></li>
            </ul>
          </section>
          <section class="screensaver__tier screensaver__tier--silver" aria-labelledby="display-silver">
            <h2 id="display-silver">Silver sponsors</h2>
            <ul class="screensaver__logos">
              <li><img src="img/loghi/bloomberg/bloomberg-engineering-black.webp" alt="Bloomberg Engineering" width="1200" height="483"></li>
              <li><img src="img/loghi/standard-chartered/sc-lock-up-english-grey-rgb.svg" alt="Standard Chartered" width="3828" height="2010"></li>
            </ul>
          </section>
          <section class="screensaver__tier screensaver__tier--bronze" aria-labelledby="display-bronze">
            <h2 id="display-bronze">Bronze sponsors</h2>
            <ul class="screensaver__logos">
              <li><img src="img/loghi/vedrai/vedrai-positive.png" alt="Vedrai" width="2497" height="737"></li>
              <li><img src="img/loghi/adia-lab/adia-lab.png" alt="ADIA Lab" width="456" height="70"></li>
              <li><img src="img/loghi/us-bank/us-bank-red-blue.svg" alt="U.S. Bank" width="320" height="146"></li>
            </ul>
          </section>
          <section class="screensaver__tier screensaver__tier--carte" aria-labelledby="display-carte">
            <h2 id="display-carte">À la carte sponsor</h2>
            <ul class="screensaver__logos">
              <li><img src="img/loghi/needlestack/needlestack-technologies.svg" alt="Needlestack Technologies" width="660" height="164"></li>
            </ul>
          </section>
        </div>
      </footer>
    </main>

    <div class="screensaver__controls" role="group" aria-label="Display controls" hidden>
      <div class="screensaver__settings">
        <label class="screensaver__setting">Display
          <select class="select" data-display-mode aria-label="Display content">
            <option value="logo">Logo</option>
            <option value="programme">Programme</option>
          </select>
        </label>
        <div class="screensaver__programme-settings" data-programme-settings hidden>
          <label class="screensaver__setting">Day
            <select class="select" data-display-day aria-label="Programme day" disabled><option>Loading…</option></select>
          </label>
          <label class="screensaver__setting screensaver__setting--room">Room
            <select class="select" data-display-room aria-label="Programme room" disabled><option>Loading…</option></select>
          </label>
          <label class="screensaver__setting">Layout
            <select class="select" data-display-density aria-label="Programme layout">
              <option value="comfortable">Comfortable</option>
              <option value="compact">Compact</option>
            </select>
          </label>
        </div>
      </div>
      <div class="screensaver__actions">
      <a class="btn" href="/" aria-label="Return to the ICAIF website" title="Return to the ICAIF website">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m12 19-7-7 7-7M5 12h14"></path></svg>
        <span class="screensaver__control-label">Website</span>
      </a>
      <button class="btn" type="button" data-pause aria-label="Pause animation" aria-pressed="false" title="Pause animation (Space)">
        <svg data-pause-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path stroke-linecap="round" d="M9 5v14M15 5v14"></path></svg>
        <svg data-play-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" hidden><path stroke-linejoin="round" d="m8 5 11 7-11 7z"></path></svg>
        <span class="screensaver__control-label" data-pause-label>Pause</span>
      </button>
      <button class="btn" type="button" data-fullscreen aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen (F)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"></path></svg>
        <span class="screensaver__control-label" data-fullscreen-label>Fullscreen</span>
      </button>
      </div>
      <p class="screensaver__status" role="status" aria-live="polite" data-display-status></p>
    </div>
